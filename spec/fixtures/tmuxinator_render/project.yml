# $TMPDIR/workspace.myapp.yml

name: myapp
root: /src/my app
tmux_options: -CC
attach: false

startup_pane: 2

windows:
  - workspace-myapp:
      layout: even-vertical
      panes:
        - |
          tmux set-option -t '=myapp:' @workspace myapp || true
          printf '\033]2;workspace-myapp\a'
          tmux resize-pane -t myapp:0.0 -y 15% || true
          tmux resize-pane -t myapp:0.2 -y 35% || true
          command -v ascii-banner >/dev/null && ascii-banner "myapp" --rainbow --random -W --center --minimal || echo "myapp"
        - claude --dangerously-skip-permissions --continue || claude --dangerously-skip-permissions
        - echo 'Ready to work on myapp'
