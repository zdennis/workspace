# $TMPDIR/workspace.myapp.worktree-proj-123.yml

name: myapp-wt-proj-123
root: /src/myapp/.worktrees/PROJ-123
tmux_options: -CC
attach: false

on_project_start: |
  tmux resize-pane -t myapp-wt-proj-123:0.0 -y 15%
  tmux resize-pane -t myapp-wt-proj-123:0.2 -y 35%

startup_pane: 2

windows:
  - workspace-myapp-wt-proj-123:
      layout: even-vertical
      panes:
        - |
          tmux set-option -t '=myapp-wt-proj-123:' @workspace myapp.worktree-proj-123 || true
          printf '\033]2;workspace-myapp-wt-proj-123\a' &&
          tmux resize-pane -t myapp-wt-proj-123:0.0 -y 15% &&
          tmux resize-pane -t myapp-wt-proj-123:0.2 -y 35% &&
          ascii-banner "myapp PROJ 123" --rainbow --random -W --center --minimal
        - claude --dangerously-skip-permissions --continue || claude --dangerously-skip-permissions
        - echo 'Worktree — PROJ-123 (myapp)'
