# {{CONFIG_PATH}}

name: {{TMUX_SESSION_NAME}}
root: {{WORKTREE_PATH}}
tmux_options: -CC
attach: false
{{PRE_WINDOW}}

startup_pane: 2

windows:
  - workspace-{{TMUX_SESSION_NAME}}:
      layout: even-vertical
      panes:
        - |
          tmux set-option -t '={{TMUX_SESSION_NAME}}:' @workspace {{WORKSPACE_NAME}} || true
          printf '\033]2;workspace-{{TMUX_SESSION_NAME}}\a'
          tmux resize-pane -t {{TMUX_SESSION_NAME}}:0.0 -y 15% || true
          tmux resize-pane -t {{TMUX_SESSION_NAME}}:0.2 -y 35% || true
          command -v ascii-banner >/dev/null && ascii-banner "{{DISPLAY_NAME}}" --rainbow --random -W --center --minimal || echo "{{DISPLAY_NAME}}"
        - {{AGENT_COMMAND}}
        - echo 'Worktree — {{WORKTREE_BRANCH}} ({{PROJECT_NAME}})'
