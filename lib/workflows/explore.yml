schema_version: 0.1
id: explore
title: Explore and report
description: Read-only research into a question, a gate on the findings, then a report note. Changes no code.

use_when: A question to answer by reading, with no code change.

inputs:
  task:
    description: The question to explore, or the path of a brief. `workflow run` fills it from the open pull request, else `Branch NAME`, when left out.
    required: true
  topic:
    description: A short title for file names and inbox titles (letters, digits, . _ -, no spaces; up to 60 characters); when left out the agent picks a few words itself.
    required: false
    pattern: '[A-Za-z0-9][A-Za-z0-9._-]{0,59}'

instructions: |
  You are exploring a question in workspace {{workspace}}. Change no code and commit nothing.
  The notes go in the notes directory (`workspace notes dir --create`); only the small
  run files named in each step go under {{artifacts}}/.
  Cite evidence as path:line, a commit or a link, and mark inference as inference.
  Use today's date from `date +%F` for <date>. <topic> is "{{inputs.topic}}" (when that is
  empty, choose two to five words in lower case with hyphens).

  The brief:

  {{inputs.task}}

max_attempts: 6

steps:
  survey:
    title: Survey
    include: [notes, report]
    prompt: |
      Answer the brief above from the code, docs, tests, event logs and past runs.
      Write the survey as <date>-<topic>-survey.md in the notes directory: the questions, what exists today, each gap with its
      evidence, and which gaps you would report on, ranked, for the person to prune. Parts of the brief that
      ask for what the report must contain (examples, diagrams, a format) belong to the report
      step: only note them here. On a
      rerun after a rejection, update that note and follow the rejection's text.
      Then write {{artifacts}}/survey.md: first line `note: <file name of the note>`, then
      the ranked gaps, one line each.
      Post last, after survey.md is written, as the report pack says, naming the note: title
      `Survey: <topic>`, type `review_request`, `--link-run {{run}} --dedupe-key explore:{{run}}
      --reopen --expires 168h`.
    produces: [survey.md]
    require:
      - inbox_item: "explore:{{run}}"
    guard: unchanged
    gate: approve
    timeout: 90m

  report:
    title: Report
    include: [notes, report]
    prompt: |
      Read the approved survey note your instructions name, and keep to the person's
      approval note under `## For this attempt`: what they cut stays out of the report. Check
      `workspace workflow status` (`steps[].gate_note` of survey) if that section is missing.
      Meet the brief's requirements for the report here.
      Write the report as <date>-<topic>-report.md in the notes directory: the verdict first,
      then ranked recommendations, then the detail. Give each missing feature a concrete
      example of its use and a Mermaid diagram where it helps. Have a skeptical sub-agent
      check every claim against the code and fix what it finds.
      Write the note's file name to {{artifacts}}/report.md and run
      `workspace inbox done --dedupe-key explore:{{run}} --name {{workspace}}`, then hand the
      note back with the title `Report: <topic>`, `--dedupe-key explore-report:{{run}} --reopen`.
    produces: [report.md]
    require:
      - inbox_item: "explore-report:{{run}}"
    guard: config
    timeout: 90m
