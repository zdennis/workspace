schema_version: 0.1
id: rpiv
title: Research, Plan, Implement, Verify
description: One feature end to end in one workspace, with a plan gate and a test-backed verify loop.

use_when: A feature or change to build end to end, with a plan to approve first.

inputs:
  task:
    description: What to build. A ticket key with a sentence, or a path to a spec in the worktree. `workflow run` fills it from the open pull request, else `Branch NAME`, when left out.
    required: true
  spec:
    description: Optional spec or ticket file to read first.

instructions: |
  You are working on {{inputs.task}} in workspace {{workspace}}, branch {{branch}}.
  Spec (may be empty): {{inputs.spec}}
  Every artifact for this run goes under {{artifacts}}/. Earlier steps' artifacts are
  inputs; read them before you start.

# Four steps fit in ten: one plan rejection and three trips back from verify. A failed
# check or report now also loops the run back one step by default (research and plan and
# implement can each spend a spare attempt that way), so 14 leaves the headroom.
max_attempts: 14

steps:
  research:
    import: research

  plan:
    title: Plan
    include: [notes, implementation-plan]
    prompt: |
      Using {{artifacts}}/research.md, write the plan as the workspace plan: the
      IMPLEMENTATION_PLAN.md that `workspace plan path` names (run `workspace plan init --title "<title>"` first if it does not exist), in the syntax the
      implementation-plan instructions give, so `workspace plan status` shows it.
      One task per commit, in order, with the files touched, tests to add and how you'll
      know it works under that task in Task details, and the R-numbers from
      {{artifacts}}/requirements.md it covers: every R needs a task, and the run checks it.
      Call out anything that needs the
      dev environment or the test database. Set `status: active` and leave every task `[ ]`.
      You only write the plan here; do not start any task, and do not set `status: done`.
      Then write {{artifacts}}/plan.md for the approval gate: the approach, the risks, and
      the path of the plan file. Do not copy the task list into it. The step is not
      finished until plan.md exists.
      Don't change code.
    produces: [plan.md]
    guard: config
    # Done only when the workspace plan exists, has at least one task, and names in its Task
    # details every R-number requirements.md starts a line with (when that file exists).
    status:
      run: workspace step check-ids --prefix R --defined requirements.md --allow-missing --plan-details
    gate: approve
    timeout: 45m

  implement:
    import: implement

  verify:
    title: Verify
    include: [review]
    prompt: |
      Verify the work against the workspace plan (`workspace plan path`). Run the tests for the
      files the change touched, their obvious neighbors, and the tests the change obviously
      impacts — not the whole suite (it runs on CI). Run the linter (the project's lint
      command, when it has one, must pass: the run checks it), then review the branch's diff against its base.
      Check each R in {{artifacts}}/requirements.md against evidence: a test name, command
      output or file:line.
      Write {{artifacts}}/verify.md: test results, each R with its evidence, review findings,
      and what you fixed.
      If anything blocking remains, run `workspace step done --status fail --summary "<what is left>"`
      and end your turn.
    produces: [verify.md]
    uses: [test-db]
    status:
      command: test
      # The check runs the project's whole test command, which on a sizable
      # suite can outrun the 20-minute default; the step itself allows 90m.
      timeout: 40m
    require:
      - command: lint
        optional: true
    timeout: 90m
    on_fail:
      goto: implement
      max: 3
      context: continue
