schema_version: 1
id: rpiv-auto-approve
title: Research, Plan, Implement, Verify (auto-approve)
description: One feature end to end with no person, three isolated reviewer conversations the engine dispatches on the plan, and a test-backed verify loop.
extends: rpiv

use_when: A feature or change to build end to end when no person will review the plan.

# A rejection round costs five attempts (plan, three reviewers, the tally; attempts_made
# counts every step of the run), so nine retries plus the approving round are 50. Research
# adds 1 and implement and verify with three trips back from verify add 8. Attempts a
# redelivery re-runs do not count against max_attempts, so 68 is a safe ceiling rather
# than an exact worst case.
max_attempts: 68

replace:
  plan:
    title: Plan
    include: [notes, implementation-plan]
    prompt: |
      If {{artifacts}}/plan-approval.md exists, reviewers turned the last plan down. Read every
      reviewer's reasons, including the ones that approved. Don't just patch the objection or
      argue with it: rethink what it takes, and find an approach that meets the concerns of all
      the reviewers, changing the design if the current one can't. Keep what is sound, and say
      in plan.md how each objection was answered.
      Using {{artifacts}}/research.md, write the plan as the workspace plan: the
      IMPLEMENTATION_PLAN.md that `workspace plan path` names (run `workspace plan init --title "<title>"` first if it does not exist), in the syntax the
      implementation-plan instructions give, so `workspace plan status` shows it.
      One task per commit, in order, with the files touched, tests to add and how you'll
      know it works under that task in Task details. Call out anything that needs the
      dev environment or the test database. Set `status: active` and leave every task `[ ]`.
      You only write the plan here; do not start any task, and do not set `status: done`.
      Then write {{artifacts}}/plan.md: the approach, the risks, and
      the path of the plan file. Do not copy the task list into it. The step is not
      finished until plan.md exists.
      Don't change code.
    produces: [plan.md]
    guard: unchanged
    # Done only when the workspace plan exists and has at least one task.
    status:
      run: |
        workspace plan status --json | ruby -rjson -e 'plan = JSON.parse($stdin.read)["plans"].to_a.first; exit(plan && plan["exists"] && plan["counts"]["total"].to_i > 0 ? 0 : 1)'
    timeout: 45m

steps:
  review_supportive:
    after: plan
    title: Supportive review
    # A conversation of its own, dispatched by the engine: none of the planner's or another
    # reviewer's reasoning is in it, and the run's attempt record ties it to its session.
    context: fresh
    prompt: |
      You are the supportive reviewer of the workspace plan (`workspace plan path`). No person
      will look at it, so this review is the only approval it gets.
      Run `workspace plan status --json` and take `plans[0].revision` as REV. Read the plan and
      {{artifacts}}/research.md. Do not edit the plan, do not change code, and write no file
      but your own verdict file.
      Your brief: look for what makes the plan sound, and approve unless something would
      really stop it working.
      Write {{artifacts}}/approval-supportive.md with exactly these three lines first, in this
      order and with no other formatting, then your reasons:
      reviewer: supportive
      verdict: approve or reject
      plan_revision: REV
    produces: [approval-supportive.md]
    guard: unchanged
    timeout: 30m

  review_skeptical:
    after: review_supportive
    title: Skeptical review
    context: fresh
    prompt: |
      You are the skeptical reviewer of the workspace plan (`workspace plan path`). No person
      will look at it, so this review is the only approval it gets.
      Run `workspace plan status --json` and take `plans[0].revision` as REV. Read the plan and
      {{artifacts}}/research.md. Do not edit the plan, do not change code, and write no file
      but your own verdict file.
      Your brief: assume the plan is wrong and try to prove it: missing cases, wrong order,
      steps that can't be undone, requirements of the task it doesn't meet. Approve only
      if you can't find a blocking problem.
      Write {{artifacts}}/approval-skeptical.md with exactly these three lines first, in this
      order and with no other formatting, then your reasons:
      reviewer: skeptical
      verdict: approve or reject
      plan_revision: REV
    produces: [approval-skeptical.md]
    guard: unchanged
    timeout: 30m

  review_implementer:
    after: review_skeptical
    title: Implementer review
    context: fresh
    prompt: |
      You are the implementer reviewer of the workspace plan (`workspace plan path`). No person
      will look at it, so this review is the only approval it gets. You will have to build this.
      Run `workspace plan status --json` and take `plans[0].revision` as REV. Read the plan and
      {{artifacts}}/research.md. Do not edit the plan, do not change code, and write no file
      but your own verdict file.
      Your brief: check each task is small, ordered, testable and says enough to start, and
      approve unless something would really stop you.
      Write {{artifacts}}/approval-implementer.md with exactly these three lines first, in this
      order and with no other formatting, then your reasons:
      reviewer: implementer
      verdict: approve or reject
      plan_revision: REV
    produces: [approval-implementer.md]
    guard: unchanged
    timeout: 30m

  plan_review:
    after: review_implementer
    title: Plan review
    # The tally reads the three verdict files and writes the summary the plan step reads for
    # the last round's objections, and posts the round's outcome to the person's inbox. It is
    # a fresh conversation with no reviewer's reasoning in it.
    context: fresh
    prompt: |
      Read the three reviewer verdict files under {{artifacts}}: approval-supportive.md,
      approval-skeptical.md and approval-implementer.md. Each holds its reviewer, verdict and
      plan_revision header lines, then the reviewer's reasons.
      Run `workspace plan status --json` and take `plans[0].revision` as REV.
      Write {{artifacts}}/plan-approval.md with exactly these four lines first, in this order
      and with no other formatting — each verdict quoted from the matching verdict file:
      plan_revision: REV
      supportive: approve or reject
      skeptical: approve or reject
      implementer: approve or reject
      Then each reviewer's reasons, quoted from its verdict file.
      Post one inbox item so the person can audit this round: title `Plan review:
      <approve|reject>`, type `review_request`, `--link-run {{run}} --dedupe-key
      rpiv-auto-approve:{{run}} --reopen --expires 168h`, its text the four summary lines.
      Do not edit the plan, the verdict files, or code.
    produces: [plan-approval.md]
    guard: unchanged
    # Done only when every verdict file is there, each names its own role and the plan as it
    # stands now, the summary matches the verdicts, and the skeptic plus one other approved.
    # A rejection or a malformed round goes back to plan. A plan edited during review reports
    # its own code and does not loop: the run stops with the plan file untouched.
    status:
      report_code: true
      run: |
        workspace plan status --json | ruby -rjson -e '
          plan = JSON.parse($stdin.read)["plans"].to_a.first
          dir = ENV.fetch("WORKSPACE_RUN_ARTIFACTS")
          roles = %w[supportive skeptical implementer]
          revision = plan && plan["revision"]
          stale = false
          votes = roles.map do |role|
            path = File.join(dir, "approval-#{role}.md")
            lines = File.file?(path) ? File.readlines(path, chomp: true).first(3) : []
            fields = lines.to_h { |line| [line[/\A[a-z_]+/].to_s, line[/\A[a-z_]+: (.*)\z/, 1].to_s] }
            stale ||= fields.key?("plan_revision") && fields["plan_revision"] != revision
            next "missing" unless fields["reviewer"] == role && fields["plan_revision"] == revision && %w[approve reject].include?(fields["verdict"])
            fields["verdict"]
          end
          approval = File.join(dir, "plan-approval.md")
          summary = File.file?(approval) ? File.readlines(approval, chomp: true).first(4) : []
          stale ||= summary[0].to_s.start_with?("plan_revision:") && summary[0] != "plan_revision: #{revision}"
          expected = ["plan_revision: #{revision}", *roles.each_with_index.map { |role, i| "#{role}: #{votes[i]}" }]
          ok = revision && summary == expected && votes[1] == "approve" && votes.count("approve") >= 2
          puts "code: stale_plan_revision" if !ok && stale
          exit(ok ? 0 : 1)
        '
    on_fail:
      goto: plan
      max: 9
      context: fresh
      except: [stale_plan_revision, guard, check_error]
    timeout: 30m
