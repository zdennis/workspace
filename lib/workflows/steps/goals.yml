schema_version: 0.1
description: The goals step of a delivery pipeline. It reads the code the task touches (changing nothing, before any commit) and writes goals.md and acceptance.md. It needs {{inputs.task}}, has no reviewers and uses no command role; the check is `workspace step check-ids`, which passes only when every AC line names how it will be verified.

steps:
  goals:
    title: Goals
    prompt: |
      Set the goals for {{inputs.task}}. Read what you need to understand it, but don't change
      code or commit.
      Write {{artifacts}}/goals.md: the goal, the user or caller it serves, and the non-goals
      (what this change will not do).
      Write {{artifacts}}/acceptance.md: one line per acceptance criterion, each line starting
      with its number and a space (`AC1 `, `AC2 `, ...). Each criterion reads Given ... When ...
      Then ... and ends with how it will be verified: `test`, `manual` or `metric`, for example
      `AC1 Given a signed-in user When they open the page Then they see their name — test`.
    produces: [goals.md, acceptance.md]
    guard: unchanged
    status:
      run: "grep -Eq '^AC-?[0-9]+ ' \"$WORKSPACE_RUN_ARTIFACTS/acceptance.md\" && workspace step check-ids --prefix AC --defined acceptance.md --covered acceptance.md --each-line-matches '^AC-?[0-9]+ .*[^A-Za-z](test|manual|metric)[^A-Za-z]*$'"
    timeout: 30m
