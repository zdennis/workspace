schema_version: 0.1
description: The implement step rpiv and rpiv-auto-approve share. It builds the workspace plan one commit per task and sets the plan's status to done.

steps:
  implement:
    title: Implement
    include: [notes, implementation-plan]
    prompt: |
      Implement the workspace plan (`workspace plan path`) one task at a time, marking
      each task as the instructions say. Run the relevant tests before each commit. If the
      plan turns out wrong, update the plan file and say why in {{artifacts}}/implement.md.
      Write {{artifacts}}/implement.md listing the commits you made, then set the plan's
      `status: done`; the run is waiting on that file and on that status. Make at least one commit.
      On a rerun (after a failed verify, or a resume), make a new commit for the fix and never
      amend or rebase, which the run's commit check can't follow. If no code change is needed,
      run `git commit --allow-empty -m '<why>'`.
    produces: [implement.md]
    require:
      - commits: 1
      - plan_status: done
    timeout: 3h
