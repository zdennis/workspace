name: CI

on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Lint
        run: bundle exec standardrb lib/ spec/

  specs:
    name: specs (${{ matrix.group }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: unit-integration
            paths: spec/unit spec/integration
          - group: system-commands
            paths: spec/system/workspace/commands
          - group: system
            paths: spec/system
            exclude: spec/system/workspace/commands/
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install tmux
        run: brew install tmux

      - name: Configure git identity for specs that commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Specs
        run: |
          mkdir -p tmp
          exclude=()
          if [ -n "${{ matrix.exclude }}" ]; then exclude=(--exclude-pattern "${{ matrix.exclude }}"); fi
          bundle exec parallel_rspec -n 3 --group-by filesize "${exclude[@]}" \
            -o "--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/runtime-${{ matrix.group }}.log" \
            ${{ matrix.paths }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.group }}
          path: tmp/runtime-${{ matrix.group }}.log
