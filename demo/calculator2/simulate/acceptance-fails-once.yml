# The first acceptance run fails, so the run goes back to implement once; the second passes.
inputs:
  task: "Deliver the goal in goals/01.md"
  goal: goals/01.md
  acceptance: script/acceptance_runner
steps:
  plan:
    - reviews: {skeptical: approve}
  acceptance:
    - {require: {exec: fail}, log: "goal not met: 2 of 5 checks failed"}
    - {}
