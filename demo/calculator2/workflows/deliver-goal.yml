# Delivers one goal document end to end with no person: research, a fresh plan, implement, verify,
# then a final step whose only job is to run the project's own acceptance program over the result.
# It extends rpiv-auto-approve-v2; it replaces `plan` (a plan left by an earlier goal must go first, and one
# skeptical reviewer checks it), `implement` and `verify` (only the prompt and the dropped review pack differ;
# the parent's check, proofs and loop are restated), and adds `acceptance` after `verify`.
# The plan step has one reviewer, skeptical, and it names `model: sonnet`, so the plan review is a direct round: the
# review pane starts on Sonnet and writes the verdict itself, and the Opus pane no longer sits over a Sonnet
# sub-agent for it.
schema_version: 0.1
id: deliver-goal
title: Deliver a goal, checked by the project's acceptance program
description: Researches, plans, builds and verifies one goal document, then runs an acceptance program on the result and loops back to implement once if it fails.
extends: rpiv-auto-approve-v2

use_when: A goal written in a document in the checkout, with an acceptance program the agents cannot read, to deliver with no person.

inputs:
  goal:
    description: Path, inside the checkout, to the document that states the goal to deliver.
    required: true
  acceptance:
    description: Path to the project's acceptance program, an executable that takes the goal path and exits 0 when the goal is met.
    required: true

instructions: |
  You are delivering a goal in workspace {{workspace}}, branch {{branch}}: {{inputs.task}}
  The goal is written in {{inputs.goal}}. Read that document first and treat it as the brief:
  build what it asks and nothing beyond it. Do not read, run, or look for the program that
  accepts the work; it is not yours to see.
  Shell commands that mention a hidden or denied path, even one you only saw in a log or error,
  inside quotes or an inline script, are blocked and reported; keep such paths out of shell
  command lines.
  Spec (may be empty): {{inputs.spec}}
  Every artifact for this run goes under {{artifacts}}/. Earlier steps' artifacts are
  inputs; read them before you start.

# Parent's 21 attempts plus up to 4 for the acceptance step and the second pass through
# implement and verify that its one loop back can cause.
max_attempts: 25
# The parent's 8h plus the acceptance step's 15 minutes and a second pass of implement.
timeout: 9h
# Keeps the agents off the acceptance program (a tripwire, see docs/README.workflow.md).
deny:
  - "*calculator2/acceptance/*"
  - "*calculator2/acceptance"
  - "*refs/demo-calc2*"

# A reviewer replaces the parent's whole entry, so the parent's skeptical prompt is restated; only `model` is new.
reviewers:
  skeptical:
    title: Skeptical review
    model: sonnet
    prompt: |
      You review {{review.subject}}. No person will look at it. Assume it is wrong and try
      to prove it: missing cases, wrong order, steps that can't be undone, any R in
      {{artifacts}}/requirements.md with no task, and any reading chosen there that the brief
      does not support. Approve only if you can't find a blocking problem. Do not edit the plan.
      If {{review.previous}} is set, read your earlier write-up there first and say whether
      each objection in it was answered.

replace:
  plan:
    title: Plan
    # Resumes the research step's session, so the agent keeps what it read.
    context: continue
    include: [notes, implementation-plan]
    prompt: |
      The goal is in {{inputs.goal}}; read it, and {{artifacts}}/research.md.
      This workspace may still hold a plan from an earlier goal. Run `workspace plan show`. If a
      plan exists and it is not this goal's own plan (it is done, or it is for another goal), run
      `workspace plan delete --yes`, then `workspace plan init --title "<title>"`, and write a fresh plan
      for this goal. `plan init` refuses to overwrite an existing plan, so the delete comes first.
      If the reviewer turned the last plan down, read the reviewer's reasons in full. Don't just
      patch each objection: rethink what it takes, and change the
      design if the current one can't meet them all. Edit the plan you wrote earlier in this
      run; do not delete it again.
      Write the plan as the workspace plan: the IMPLEMENTATION_PLAN.md that `workspace plan path`
      names, in the syntax the implementation-plan instructions give, so `workspace plan status`
      shows it.
      One task per commit, in order, with the files touched, tests to add and how you'll
      know it works under that task in Task details, and the R-numbers from
      {{artifacts}}/requirements.md it covers: every R needs a task, and the run checks it.
      Call out anything that needs the dev environment or the test database. Set `status: active` and leave every task `[ ]`.
      You only write the plan here; do not start any task, and do not set `status: done`.
      Then write {{artifacts}}/plan.md: the approach, the risks, and
      the path of the plan file. Do not copy the task list into it. The step is not
      finished until plan.md exists.
      Say in plan.md how each of the reviewer's objections, if any, was answered.
      No person reads the plan before it is built, so record each reading chosen in
      {{artifacts}}/requirements.md for an open part with
      `workspace ask "<the open question>" --default "<the reading chosen>"`, once each, and
      carry on without waiting for an answer.
      Don't change code.
    produces: [plan.md]
    guard: config
    # Done only when the workspace plan exists, has at least one task, is not already done (a done
    # plan is one left over from an earlier goal), and names in its Task details every R-number
    # requirements.md starts a line with (when that file exists).
    status:
      run: |
        workspace plan status --json | ruby -rjson -e 'plan = JSON.parse($stdin.read)["plans"].to_a.first; exit 1 unless plan && plan["exists"] && plan["counts"]["total"].to_i > 0 && plan["state"] != "done" && plan["status"] != "done"; req = File.join(ENV.fetch("WORKSPACE_RUN_ARTIFACTS"), "requirements.md"); exit 0 unless File.file?(req); details = File.read(plan["path"])[/^## Task details\r?$(.*?)(?=^## |\z)/m, 1].to_s; missing = File.read(req).scan(/^R\d+\b/).uniq - details.scan(/\bR\d+\b/); abort "In no task of ## Task details: #{missing.join(" ")}" if missing.any?'
    timeout: 45m
    max_attempts: 8
    review:
      from: [skeptical]
      need: 1
      must: [skeptical]
      subject: the workspace plan (`workspace plan path`), against {{inputs.goal}}, {{artifacts}}/research.md and {{artifacts}}/requirements.md
      revision: workspace plan status --json | ruby -rjson -e 'data = JSON.parse($stdin.read); abort "no plans" unless data.key?("plans"); puts data["plans"].to_a.first&.dig("revision")'
      max_rounds: 6
      timeout: 30m
      context: fresh

  # Only the prompt differs from the parent's implement; extends can replace a step only whole,
  # so every other key restates the parent's.
  implement:
    title: Implement
    include: [notes, implementation-plan]
    # Resumes the plan step's session: about 13.7% fewer tokens and 5% less cost than a fresh one.
    context: continue
    prompt: |
      Implement the workspace plan (`workspace plan path`) one task at a time, marking
      each task as the instructions say. Run the relevant tests before each commit. If the
      plan turns out wrong, update the plan file and say why in {{artifacts}}/implement.md.
      Do not start sub-agents; the verify step runs the checks after you.
      Write {{artifacts}}/implement.md listing the commits you made, then set the plan's
      `status: done`; the run is waiting on that file and on that status. Make at least one commit.
      End your turn with your status line only after all of that work is finished, never while
      anything is still running.
      On a rerun (after a failed verify, or a resume), make a new commit for the fix and never
      amend or rebase, which the run's commit check can't follow. If no code change is needed,
      run `git commit --allow-empty -m '<why>'`.
    produces: [implement.md]
    require:
      - commits: 1
      - plan_status: done
    timeout: 3h

  # Only the prompt and the dropped review pack differ from the parent's verify; extends can
  # replace a step only whole, so every other key restates the parent's. The review pack is
  # left out: it sends the agent to spawn reviewer sub-agents, which defeats the token cut.
  verify:
    title: Verify
    prompt: |
      Judge the work against the workspace plan (`workspace plan path`) and {{inputs.goal}}.
      When your turn ends, this step runs the project's test command and its lint command,
      when it has one, for you and fails if either fails. Do not run the whole test suite or the linter yourself:
      that would repeat those checks. Review the diff yourself; do not start sub-agents or
      reviewers.
      Read the branch's diff against the run base and decide whether it does what the goal asks,
      and nothing beyond it. Run a targeted command only to confirm a suspicion, such as one
      test file or one command that shows a behaviour you doubt. Fix any real defect you find,
      with a new commit rather than an amend. After a fix, rerun only the tests you changed or
      added, not the whole suite or the linter.
      Write {{artifacts}}/verify.md: what you read, what you ran and why, your findings, and
      what you fixed (or that nothing needed fixing).
      If anything blocking remains, run `workspace step done --status fail --summary "<what is left>"`
      and end your turn.
    produces: [verify.md]
    uses: [test-db]
    status:
      command: test
      timeout: 40m
    require:
      - command: lint
        optional: true
    timeout: 90m
    on_fail:
      goto: implement
      max: 3
      context: continue

steps:
  acceptance:
    after: verify
    title: Acceptance
    # Resumes verify's session instead of opening a fresh one for a step that changes nothing.
    context: continue
    prompt: "Change nothing; end your turn."
    guard: config
    require:
      - exec: "/usr/bin/env git diff --quiet HEAD"
      - exec: "/usr/bin/env {{inputs.acceptance}} {{inputs.goal}}"
        timeout: 15m
    timeout: 20m
    max_attempts: 3
    on_fail: {goto: implement, max: 1, log_tail: 40, context: fresh}
