# Demonstrates: limits on the whole run. `timeout:` bounds its active time, `budget:` stops it when
# it has used 8M tokens, and `deny:` makes the engine refuse the agent's `git push` and `gh pr`
# commands (a tripwire, not a sandbox). Otherwise this is calc-06 (`diff calc-06-json.yml calc-07-repl.yml`).
schema_version: 0.1
id: calc-07-repl
title: Calculator 7, REPL mode
description: Adds `calc` with no arguments as a read-eval-print loop, with a run timeout, a token budget and denied commands.

instructions: |
  You are building a small command-line calculator in demo/calculator/ of workspace {{workspace}}:
  Ruby, standard library only, `bin/calc "EXPR"`, `lib/calc.rb`, and minitest in `test/calc_test.rb`.
  Work only inside demo/calculator/. Change nothing else in the repository, except where a step
  says to write a file under {{artifacts}}. When the step's work is done, commit it with git (do not
  push). Run the tests from the repository root with `ruby demo/calculator/test/calc_test.rb`.
  Build only this run's feature, nothing beyond it.

  This run's feature: `calc` with no arguments starts a REPL that prints `> `, evaluates each line it
  reads with the same rules and flags as the command line (`--json` included) and exits on `exit`,
  `quit` or end of input. A bad line prints its error and the loop goes on.

max_attempts: 16
timeout: 2h
budget:
  tokens: 8000000
deny:
  - "git push*"
  - "gh pr*"

reviewers:
  skeptic:
    title: Skeptical review
    prompt: |
      You review {{review.subject}}. Assume it is wrong and try to prove it: a REPL that does not
      print `> `, evaluates a line by other rules or flags than the command line (`--json`
      included), does not exit on `exit`, `quit` or end of input, or stops after a bad line;
      `calc "EXPR"` with arguments that changed; and tests that pass without checking anything. Approve only if you find no blocking problem. Do not edit any file.
      If {{review.previous}} is set, read your earlier write-up there first.

steps:
  plan:
    title: Plan (read-only)
    prompt: |
      Read demo/calculator/ and write a short plan for the brief to {{artifacts}}/plan.md: the
      change, the tests to add, and the risks. Do not change or commit anything in the checkout.
    produces: [plan.md]
    guard: unchanged

  reproduce:
    title: Write the failing test first
    prompt: |
      Follow {{artifacts}}/plan.md. Write only the tests for the brief. Do not change lib/ or bin/.
      The tests must fail now. Commit the tests, then run them from the repository root and copy ONE line
      verbatim from that real output (an error message line) into {{artifacts}}/failure.txt. Do not
      write a line you expect or compose: it must appear exactly in the output.
    produces: [failure.txt]
    require:
      - commits: 1
      - exec: "workspace step expect-fail --match-file {{artifacts}}/failure.txt --timeout 240 -- demo/calculator/test/calc_test.rb"
        timeout: 5m

  fix:
    title: Make the test pass
    prompt: |
      The test from the previous step fails. Change lib/ and bin/ so it passes and the rest of the
      tests keep passing. Do not weaken or delete the test. Commit.
    require:
      - commits: 1
    review:
      from: [skeptic]
      need: 1
      must: [skeptic]
      subject: the changes under demo/calculator/ made for the brief (`git log -p` since the run began)
      revision: git rev-parse HEAD
      max_rounds: 3
      timeout: 20m

  verify:
    title: Run the tests
    prompt: |
      Run the tests from the repository root. If they pass, there is nothing to change. Do not
      edit any file.
    context: continue
    guard: config
    status:
      run: ruby demo/calculator/test/calc_test.rb
      timeout: 5m
    on_fail: {goto: fix, max: 3, backoff: 30s, log_tail: 40}

  finish:
    title: Tests and usage notes, in parallel
    checkout: shared-edit
    execution_mode: subagents
    on_fail: stop
    fan_out:
      tests:
        title: Harden the tests
        prompt: |
          Add tests to demo/calculator/test/calc_test.rb for the `--json` edge cases (errors,
          decimals, spaces, nested parentheses). Touch no other file. Another agent is editing
          demo/calculator/USAGE.md at the same time. Commit only your file:
          `git add demo/calculator/test && git commit -m "..." -- demo/calculator/test`, and retry
          after a moment if git reports an index lock. Write a line saying what you added to
          {{artifacts}}/tests-done.md.
        produces: [tests-done.md]
        status:
          run: ruby demo/calculator/test/calc_test.rb
          timeout: 5m
      usage:
        title: Update the usage notes
        prompt: |
          Update demo/calculator/USAGE.md so it lists every operator the calculator supports and
          documents `--json` with an example. Touch no other file. Another agent is editing the
          tests at the same time. Commit only your file:
          `git add demo/calculator/USAGE.md && git commit -m "..." -- demo/calculator/USAGE.md`,
          and retry after a moment if git reports an index lock. Write a line saying what you changed
          to {{artifacts}}/usage-done.md.
        produces: [usage-done.md]
